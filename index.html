<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MindAR Christmas AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      object-fit: cover;
    }

    .mindar-ui-overlay {
      z-index: 10;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 20;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 10px 14px;
      border-radius: 999px;
      font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="status">請允許相機，然後對準圖片</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets timeout="10000">
    <video
      id="christmasAnimation"
      src="./dog.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video
      src="#christmasAnimation"
      position="0 0 0.01"
      width="1"
      height="0.5637"
      material="shader: flat; transparent: true;">
    </a-video>
  </a-entity>

</a-scene>

<script>
  const scene = document.querySelector("a-scene");
  const target = document.querySelector("#target");
  const video = document.querySelector("#christmasAnimation");
  const status = document.querySelector("#status");

  scene.addEventListener("arReady", () => {
    status.textContent = "相機已啟動，請對準圖片";
    setTimeout(() => {
      const cameraVideo = document.querySelector("video:not(#christmasAnimation)");
      if (cameraVideo) {
        cameraVideo.setAttribute("playsinline", "");
        cameraVideo.setAttribute("webkit-playsinline", "");
        cameraVideo.style.position = "fixed";
        cameraVideo.style.inset = "0";
        cameraVideo.style.width = "100%";
        cameraVideo.style.height = "100%";
        cameraVideo.style.objectFit = "cover";
        cameraVideo.style.zIndex = "-2";
        cameraVideo.style.display = "block";
        cameraVideo.style.visibility = "visible";
        cameraVideo.style.opacity = "1";
        cameraVideo.style.background = "transparent";
        cameraVideo.play().catch(() => {});
      }
      const canvas = document.querySelector("canvas");
      if (canvas) {
        canvas.style.background = "transparent";
        canvas.style.position = "fixed";
        canvas.style.inset = "0";
        canvas.style.zIndex = "0";
      }
    }, 300);
  });

  scene.addEventListener("arError", () => {
    status.textContent = "相機啟動失敗，請重新整理並允許相機";
  });

  target.addEventListener("targetFound", async () => {
    status.textContent = "已辨認圖片";
    try { await video.play(); } catch (e) {}
  });

  target.addEventListener("targetLost", () => {
    status.textContent = "請重新對準圖片";
    video.pause();
  });
</script>

</body>
</html>
